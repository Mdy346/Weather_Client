[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-client"
version = "0.1.0"
description = "Asynchronous weather API client for Python engineering practice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.scripts]
weather = "weather_client.cli:main"

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_client"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call real third-party services",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF",
]

# 面向用户的中文文案使用全角标点，RUF001 对这类字符属误报。
allowed-confusables = ["（", "）", "，", "：", "、"]
